# Security headers for the files nginx serves itself. Included in every static
# location, because add_header inside a location replaces the server's headers.
#
# The build has no inline scripts, inline styles or external resources, so the
# policy allows only this origin.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
